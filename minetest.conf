# Defaults for this game; a player's own minetest.conf overrides them

enable_dynamic_shadows = true
enable_post_processing = true
enable_bloom = true
enable_volumetric_lighting = true
enable_auto_exposure = true

# Players are sent to clients within this many mapblocks (16 = 256 nodes; interiors are 500 apart)
player_transfer_distance = 1
